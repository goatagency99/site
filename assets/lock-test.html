<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>lock test</title>
<style>body{font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif;margin:0;padding:20px;background:#fff;color:#111}
button{display:block;width:100%;margin:12px 0;padding:18px;font-size:17px;border:0;border-radius:14px;background:#111;color:#fff}
pre{white-space:pre-wrap;background:#f2f2f2;padding:10px;border-radius:10px;font-size:12px}</style></head>
<body>
<h3>Lock-screen test (minimal page)</h3>
<p>Tap ONE button, wait 5 s, lock the phone, look at the lock screen. Then reload the page before trying the other button.</p>
<button id="a">A · plain &lt;audio&gt; in the page</button>
<button id="b">B · same + metadata set again after "playing"</button>
<audio id="el" preload="metadata" src="/assets/media/chicago.a.mp4"></audio>
<pre id="log">ready</pre>
<script>
(() => {
  const el = document.getElementById('el'), log = document.getElementById('log');
  const ART = [
    { src: location.origin + '/assets/img/lockscreen-alien-sky-v2-512.jpg', sizes: '512x512', type: 'image/jpeg' },
    { src: location.origin + '/assets/img/lockscreen-alien-sky-v2.jpg', sizes: '1024x1024', type: 'image/jpeg' }
  ];
  const meta = () => { navigator.mediaSession.metadata = new MediaMetadata({ title: 'LOCK TEST Alien', artist: 'bymarccc', album: 'bymarccc', artwork: ART }); navigator.mediaSession.playbackState = 'playing'; };
  const say = s => { log.textContent = s + '\n' + log.textContent.slice(0, 500); };
  navigator.mediaSession.setActionHandler('play', () => el.play());
  navigator.mediaSession.setActionHandler('pause', () => el.pause());
  const go = again => { meta(); el.play().then(() => say('playing; mediaSession title=' + (navigator.mediaSession.metadata && navigator.mediaSession.metadata.title))).catch(e => say('play() failed: ' + e.name)); if (again) el.addEventListener('playing', () => { meta(); say('metadata set again after playing'); }, { once: true }); };
  document.getElementById('a').onclick = () => go(false);
  document.getElementById('b').onclick = () => go(true);
  say('UA: ' + (/CriOS/.test(navigator.userAgent) ? 'Chrome-iOS' : /iPhone|iPad/.test(navigator.userAgent) ? 'Safari-iOS' : 'other') + ', mediaSession=' + ('mediaSession' in navigator));
})();
</script></body></html>
